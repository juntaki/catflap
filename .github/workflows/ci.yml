name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version-file: .golangci-lint-version
          args: --timeout=5m

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go test -race ./...
      - run: go build ./...

  vulncheck:
    runs-on: ubuntu-latest

    steps:
      - uses: golang/govulncheck-action@v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  deadcode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: deadcode
        # deadcode prints unreachable funcs but always exits 0:
        # fail the job when it reports anything.
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode@v0.49.0 ./...)"
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            exit 1
          fi

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7.0.0

      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go build -o ./bin/catflap ./cmd/catflap
      - run: python3 ./testdata/e2e/adversarial.py
      - run: python3 ./testdata/e2e/pairing.py
      - run: python3 ./testdata/e2e/approval.py
