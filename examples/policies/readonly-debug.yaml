version: 1
name: readonly-debug
ttl: 15m

tools:
  exec:
    allow:
      - command: systemctl
        args:
          - status
          - { match: "*" }
      - command: journalctl
        args:
          - "-u"
          - { any: true }
          - "-n"
          - { integer: { max: 1000 } }
      - command: docker
        args: [ps]
      - command: echo
        rest: any
      - command: uname
        rest: any
      - command: ls
        rest: any
  file:
    read:
      roots:
        - /var/log/myapp
        - ./testdata
