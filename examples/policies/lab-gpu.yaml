version: 1
name: lab-gpu
ttl: 30m

limits:
  max_concurrent_calls: 2
  max_exec_duration: 120s

tools:
  exec:
    allow:
      - command: nvidia-smi
      - command: python
        args:
          - { match: "/opt/jobs/*" }
      - command: echo
        rest: any
  file:
    read:
      - /datasets/**
    write:
      roots:
        - /workspace/**
      max_file_size: 2097152
      create: true
      overwrite: true
      atomic: true
