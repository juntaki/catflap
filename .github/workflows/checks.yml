name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: .golangci-lint-version
          args: --timeout=5m

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # -p 1: run package test binaries one at a time, not concurrently.
      # The real-Tailcat/DERP transport suite is CPU/network heavy on
      # its own; letting it run alongside other packages' tests under
      # -race on a constrained runner (observed specifically on
      # ubuntu-24.04-arm) starved unrelated goroutines badly enough to
      # make an otherwise sub-millisecond operation (an SSH connection
      # actually closing) not complete within 30s. Full package
      # isolation removes that contention as a class; the real-Tailcat
      # suite is already the dominant cost regardless of what else runs
      # alongside it, so serializing packages costs little extra wall
      # time in practice.
      - run: go test -race -p 1 ./...
      - run: go build ./...

  vulncheck:
    runs-on: ubuntu-latest

    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-package: ./...

  deadcode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: deadcode
        # deadcode prints unreachable funcs but always exits 0:
        # fail the job when it reports anything. -test also roots the
        # analysis in test binaries, not just cmd/catflap's main: without
        # it, internal/transport/transporttest (a shared conformance
        # suite imported only by other packages' _test.go files — the
        # same pattern as net/http/httptest) reports as entirely dead,
        # since nothing in the real binary ever calls it.
        run: |
          out="$(go run golang.org/x/tools/cmd/deadcode@v0.49.0 -test ./...)"
          if [ -n "$out" ]; then
            printf '%s\n' "$out"
            exit 1
          fi

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - run: go build -o ./bin/catflap ./cmd/catflap
      - run: python3 ./testdata/e2e/ssh_share.py
