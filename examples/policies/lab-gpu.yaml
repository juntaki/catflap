name: lab-gpu
ttl: 30m

tools:
  exec:
    allow:
      - command: nvidia-smi
      - command: python
        args:
          - { match: "/opt/jobs/*" }
      - command: echo
        rest: any
  file:
    read:
      - /datasets/**
    write:
      roots:
        - /workspace/**

limits:
  ttl: 30m
