version: 1
name: e2e-adversarial
ttl: 10m

limits:
  max_concurrent_calls: 2
  max_exec_duration: 60s
  max_stdout_bytes: 65536
  max_stderr_bytes: 16384
  max_read_bytes: 65536

tools:
  exec:
    allow:
      - command: echo
        rest: any
      - command: /bin/sleep
        args:
          - { integer: { min: 1, max: 60 } }
  file:
    read:
      - ./testdata
    write:
      roots:
        - ./testdata/e2e/work
      max_file_size: 4096
      create: true
      overwrite: true
      atomic: true
