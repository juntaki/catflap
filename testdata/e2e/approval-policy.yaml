version: 1
name: e2e-approval
ttl: 10m

tools:
  exec:
    allow:
      - command: echo
        rest: any
        approval: always
      - command: /bin/sleep
        args:
          - { integer: { min: 1, max: 60 } }
        approval: once
  file:
    write:
      roots:
        - ./testdata/e2e/work
      max_file_size: 4096
      create: true
      overwrite: true
      atomic: true
      approval: once
