version: 1
name: readonly-debug
ttl: 15m

limits:
  max_concurrent_calls: 4
  max_exec_duration: 60s
  max_stdout_bytes: 262144
  max_stderr_bytes: 65536
  max_read_bytes: 1048576

tools:
  exec:
    allow:
      - command: systemctl
        args:
          - status
          - { match: "*" }
      - command: journalctl
        args:
          - "-u"
          - { any: true }
          - "-n"
          - { integer: { max: 1000 } }
      - command: docker
        args: [ps]
      - command: echo
        rest: any
      - command: uname
        args:
          - { choice: ["-a", "-s", "-r", "-m"] }
      - command: pwd
      - command: whoami
      - command: date
  file:
    read:
      roots:
        - /var/log/myapp
        - ./testdata
