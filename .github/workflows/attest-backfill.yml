name: attest-backfill

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag whose already-published archives should be attested"
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest

    steps:
      - name: download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --repo "${{ github.repository }}" --pattern "catflap_*.tar.gz" --dir dist

      - name: attest build provenance
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: "dist/catflap_*.tar.gz"
