name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  sonar:
    runs-on: ubuntu-latest
    # Same-repo PRs and pushes only: fork PRs don't get repo secrets on
    # the pull_request event, and SONAR_TOKEN wouldn't be available.
    if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # No -race here (kept separate from checks.yml's correctness
      # suite; re-running the whole thing a second time just for
      # coverage.out isn't worth the wall time), but -p 1 stays: without
      # it, the real-Tailcat/DERP transport suite runs concurrently with
      # other packages and starves timing-sensitive tests (see
      # checks.yml's build-test comment for the same failure mode).
      - run: go test -p 1 -coverprofile=coverage.out ./...

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
